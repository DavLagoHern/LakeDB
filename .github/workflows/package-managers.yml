name: Update WinGet package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Released version without the leading v
        required: true
        type: string

permissions:
  contents: read

jobs:
  winget:
    name: Submit WinGet update
    if: vars.WINGET_PUBLISH_ENABLED == 'true'
    runs-on: windows-2025
    steps:
      - name: Resolve and verify release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          $version = if ($env:REQUESTED_VERSION) { $env:REQUESTED_VERSION } else { $env:RELEASE_TAG -replace '^v', '' }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Invalid version: $version"
          }
          gh release view "v$version" --repo DavLagoHern/LakeDB | Out-Null
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download WinGetCreate
        shell: pwsh
        run: Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Submit package update
        env:
          VERSION: ${{ steps.release.outputs.version }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: pwsh
        run: |
          $installer = "https://github.com/DavLagoHern/LakeDB/releases/download/v$env:VERSION/LakeDB-$env:VERSION-win-x64-setup.exe"
          .\wingetcreate.exe update DavidLago.LakeDB --version $env:VERSION --urls "$installer|x64" --token $env:WINGET_TOKEN --submit
