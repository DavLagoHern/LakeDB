name: Update package managers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Released version without the leading v
        required: true
        type: string

permissions:
  contents: read

jobs:
  homebrew:
    name: Update Homebrew tap
    if: vars.HOMEBREW_TAP_ENABLED == 'true'
    runs-on: macos-15
    steps:
      - name: Check out LakeDB distribution files
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Resolve and verify release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          version="${REQUESTED_VERSION:-${RELEASE_TAG#v}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          asset="LakeDB-${version}-mac-arm64.dmg"
          checksum_url="https://github.com/DavLagoHern/LakeDB/releases/download/v${version}/${asset}.sha256"
          sha256="$(curl --fail --location --silent --show-error "$checksum_url" | awk 'NR == 1 { print $1 }')"
          if [[ ! "$sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid published checksum: $sha256" >&2
            exit 1
          fi
          gh release view "v${version}" --repo DavLagoHern/LakeDB >/dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Check out Homebrew tap
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: DavLagoHern/homebrew-lakedb
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-lakedb

      - name: Update and test cask
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        shell: bash
        run: |
          mkdir -p homebrew-lakedb/Casks
          if [[ ! -f homebrew-lakedb/Casks/lakedb.rb ]]; then
            cp packaging/homebrew/Casks/lakedb.rb homebrew-lakedb/Casks/lakedb.rb
          fi
          node packaging/homebrew/update-cask.mjs \
            --cask homebrew-lakedb/Casks/lakedb.rb \
            --version "$VERSION" \
            --sha256 "$SHA256"
          brew style homebrew-lakedb/Casks/lakedb.rb

      - name: Commit tap update
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        working-directory: homebrew-lakedb
        run: |
          if git diff --quiet; then
            echo "The tap is already at LakeDB ${VERSION}."
            exit 0
          fi
          git config user.name "LakeDB release bot"
          git config user.email "DavLagoHern@users.noreply.github.com"
          git add Casks/lakedb.rb
          git commit -m "Update LakeDB to ${VERSION}"
          git push

  winget:
    name: Submit WinGet update
    if: vars.WINGET_PUBLISH_ENABLED == 'true'
    runs-on: windows-2025
    steps:
      - name: Resolve and verify release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          $version = if ($env:REQUESTED_VERSION) { $env:REQUESTED_VERSION } else { $env:RELEASE_TAG -replace '^v', '' }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Invalid version: $version"
          }
          gh release view "v$version" --repo DavLagoHern/LakeDB | Out-Null
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download WinGetCreate
        shell: pwsh
        run: Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Submit package update
        env:
          VERSION: ${{ steps.release.outputs.version }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: pwsh
        run: |
          $installer = "https://github.com/DavLagoHern/LakeDB/releases/download/v$env:VERSION/LakeDB-$env:VERSION-win-x64-setup.exe"
          .\wingetcreate.exe update DavidLago.LakeDB --version $env:VERSION --urls "$installer|x64" --token $env:WINGET_TOKEN --submit
