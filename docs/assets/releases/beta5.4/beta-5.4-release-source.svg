<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">LakeDB Beta 5.4</title>
  <desc id="desc">LakeDB Beta 5.4 adds visual relationship maps, browsable system schemas and reviewable MySQL and MariaDB user privilege management.</desc>
  <defs>
    <linearGradient id="headline" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#56ecff"/>
      <stop offset="1" stop-color="#0b7cff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b213c" stop-opacity=".94"/>
      <stop offset="1" stop-color="#06132b" stop-opacity=".96"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <image href="../../roadmap/lakedb-roadmap-beta-5.4-background-source.png" width="1920" height="1080" preserveAspectRatio="none"/>
  <rect width="1920" height="1080" fill="#020817" opacity=".34"/>
  <g stroke="#12d9ff" stroke-opacity=".07">
    <path d="M0 160H1920M0 320H1920M0 480H1920M0 640H1920M0 800H1920M0 960H1920"/>
    <path d="M160 0V1080M320 0V1080M480 0V1080M640 0V1080M800 0V1080M960 0V1080M1120 0V1080M1280 0V1080M1440 0V1080M1600 0V1080M1760 0V1080"/>
  </g>

  <image href="../../lakedb-logo.png" x="84" y="66" width="220" height="77" preserveAspectRatio="xMinYMid meet"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="84" y="374" fill="url(#headline)" font-size="128" font-weight="900">BETA 5.4</text>
    <path d="M86 431H655" stroke="#12d9ff" stroke-width="4"/>
    <text x="84" y="520" fill="#f6fbff" font-size="52" font-weight="900">SEE RELATIONSHIPS.</text>
    <text x="84" y="584" fill="#f6fbff" font-size="52" font-weight="900">UNDERSTAND ACCESS.</text>
    <text x="84" y="636" fill="#55ddff" font-size="22" font-weight="850">REAL FOREIGN KEYS · LOCAL LINKS · SYSTEM SCHEMAS</text>

    <g transform="translate(810 260)">
      <rect width="410" height="300" rx="26" fill="url(#panel)" stroke="#12d9ff" stroke-opacity=".72"/>
      <rect x="30" y="30" width="58" height="58" rx="16" fill="#08213d" stroke="#12d9ff"/>
      <text x="59" y="69" text-anchor="middle" fill="#55ddff" font-size="20" font-weight="900">01</text>
      <text x="30" y="138" fill="#f6fbff" font-size="31" font-weight="900">Map</text>
      <text x="30" y="184" fill="#a9bdd3" font-size="20">Real constraints stay solid.</text>
      <text x="30" y="218" fill="#a9bdd3" font-size="20">LakeDB-only links stay dashed.</text>
      <path d="M42 263H172" stroke="#12d9ff" stroke-width="5" stroke-linecap="round"/>
      <text x="190" y="269" fill="#dceeff" font-size="16" font-weight="800">REAL FK</text>
      <path d="M278 263H342" stroke="#a78bfa" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 10"/>
      <text x="356" y="269" fill="#d8cbff" font-size="16" font-weight="800">LOCAL</text>
    </g>

    <g transform="translate(1250 196)">
      <rect width="380" height="330" rx="26" fill="url(#panel)" stroke="#55f0bd" stroke-opacity=".68"/>
      <rect x="30" y="30" width="58" height="58" rx="16" fill="#082b32" stroke="#55f0bd"/>
      <text x="59" y="69" text-anchor="middle" fill="#55f0bd" font-size="20" font-weight="900">02</text>
      <text x="30" y="138" fill="#f6fbff" font-size="31" font-weight="900">Explore</text>
      <text x="30" y="184" fill="#a9bdd3" font-size="20">Drag tables. Pan the canvas.</text>
      <text x="30" y="218" fill="#a9bdd3" font-size="20">Zoom with the mouse wheel.</text>
      <g transform="translate(30 260)">
        <rect width="86" height="38" rx="19" fill="#071c31" stroke="#1d5d83"/><text x="43" y="25" text-anchor="middle" fill="#dceeff" font-size="15" font-weight="800">Drag</text>
        <rect x="98" width="78" height="38" rx="19" fill="#071c31" stroke="#1d5d83"/><text x="137" y="25" text-anchor="middle" fill="#dceeff" font-size="15" font-weight="800">Pan</text>
        <rect x="188" width="90" height="38" rx="19" fill="#071c31" stroke="#1d5d83"/><text x="233" y="25" text-anchor="middle" fill="#dceeff" font-size="15" font-weight="800">Zoom</text>
      </g>
    </g>

    <g transform="translate(1055 590)">
      <rect width="560" height="292" rx="26" fill="url(#panel)" stroke="#0b7cff" stroke-opacity=".7"/>
      <rect x="30" y="30" width="58" height="58" rx="16" fill="#071d3c" stroke="#0b7cff"/>
      <text x="59" y="69" text-anchor="middle" fill="#55ddff" font-size="20" font-weight="900">03</text>
      <text x="30" y="138" fill="#f6fbff" font-size="31" font-weight="900">Manage access</text>
      <text x="30" y="184" fill="#a9bdd3" font-size="20">Browse system schemas and inspect users.</text>
      <text x="30" y="218" fill="#a9bdd3" font-size="20">Review privilege SQL before applying changes.</text>
      <text x="30" y="263" fill="#55f0bd" font-size="17" font-weight="900">MYSQL · MARIADB · EXPLICIT REVIEW</text>
    </g>

    <g transform="translate(84 990)" font-size="16" font-weight="800">
      <rect width="185" height="46" rx="8" fill="#06132b" stroke="#1e5f8e"/><text x="92" y="30" text-anchor="middle" fill="#e8f5ff">Relationship maps</text>
      <rect x="198" width="186" height="46" rx="8" fill="#06132b" stroke="#1e5f8e"/><text x="291" y="30" text-anchor="middle" fill="#e8f5ff">System schemas</text>
      <rect x="397" width="196" height="46" rx="8" fill="#06132b" stroke="#1e5f8e"/><text x="495" y="30" text-anchor="middle" fill="#e8f5ff">Users &amp; privileges</text>
    </g>
    <text x="1836" y="1024" text-anchor="end" fill="#55f0bd" font-size="19" font-weight="900">Your database. Visible context.</text>
  </g>
</svg>
