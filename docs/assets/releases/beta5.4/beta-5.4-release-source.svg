<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">LakeDB Beta 5.4</title>
  <desc id="desc">A visual LakeDB Beta 5.4 release card showing relationship maps, navigation controls, system schemas, and user privileges.</desc>
  <defs>
    <linearGradient id="headline" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#62efff"/>
      <stop offset="1" stop-color="#0786ff"/>
    </linearGradient>
    <linearGradient id="leftShade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#010714" stop-opacity=".99"/>
      <stop offset=".72" stop-color="#010714" stop-opacity=".91"/>
      <stop offset="1" stop-color="#010714" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomShade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#010714" stop-opacity="0"/>
      <stop offset=".35" stop-color="#010714" stop-opacity=".82"/>
      <stop offset="1" stop-color="#010714" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#081a34" stop-opacity=".97"/>
      <stop offset="1" stop-color="#030b1d" stop-opacity=".98"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <image href="beta-5.4-release-background-v2.png" width="1920" height="1080" preserveAspectRatio="none"/>
  <rect width="820" height="850" fill="url(#leftShade)"/>
  <rect y="720" width="1920" height="360" fill="url(#bottomShade)"/>

  <image href="../../lakedb-logo.png" x="76" y="57" width="230" height="81" preserveAspectRatio="xMinYMid meet"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="76" y="356" fill="url(#headline)" font-size="132" font-weight="950" letter-spacing="-5">BETA 5.4</text>
    <path d="M78 414H650" stroke="#18ddff" stroke-width="4" filter="url(#glow)"/>
    <text x="76" y="508" fill="#f5f9ff" font-family="Impact, Arial Narrow, sans-serif" font-size="58" letter-spacing="2">COMMUNITY FEEDBACK</text>
    <text x="76" y="574" fill="#f5f9ff" font-family="Impact, Arial Narrow, sans-serif" font-size="58" letter-spacing="2">UPDATE</text>
    <text x="78" y="628" fill="#21d9ff" font-size="23" font-weight="800" letter-spacing="6">VISIBLE DATABASE CONTEXT</text>

    <g transform="translate(948 62)">
      <rect width="376" height="50" rx="25" fill="#031126" stroke="#14d9ff" stroke-width="2"/>
      <circle cx="28" cy="25" r="7" fill="#18ddff" filter="url(#glow)"/>
      <text x="50" y="33" fill="#eefaff" font-size="20" font-weight="900" letter-spacing="2">RELATIONSHIP MAP</text>
    </g>

    <g transform="translate(1288 122)">
      <rect width="260" height="44" rx="10" fill="#041027" stroke="#146ca8"/>
      <path d="M20 22H82" stroke="#18ddff" stroke-width="4" stroke-linecap="round"/>
      <text x="96" y="29" fill="#dceeff" font-size="16" font-weight="800">REAL FOREIGN KEY</text>
      <rect y="52" width="260" height="44" rx="10" fill="#041027" stroke="#5d43bd"/>
      <path d="M20 74H82" stroke="#9b71ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="11 9"/>
      <text x="96" y="81" fill="#e4d9ff" font-size="16" font-weight="800">LOCAL LINK</text>
    </g>

    <g transform="translate(76 813)">
      <g>
        <rect width="552" height="192" rx="17" fill="url(#card)" stroke="#0c9ce8" stroke-width="2"/>
        <path d="M30 43H108M30 68H108" stroke="#1bdfff" stroke-width="4" stroke-linecap="round"/>
        <path d="M30 93H108" stroke="#9b71ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="11 9"/>
        <text x="139" y="55" fill="#f2f8ff" font-size="25" font-weight="900">RELATIONSHIP MAPS</text>
        <text x="139" y="86" fill="#37dcff" font-size="17" font-weight="800">REAL FOREIGN KEYS + LOCAL LINKS</text>
        <text x="30" y="137" fill="#aebed2" font-size="17">Solid and dashed links in one trusted view.</text>
        <text x="30" y="166" fill="#f2f8ff" font-size="16" font-weight="800">DRAG TABLES · PAN · WHEEL ZOOM · SEARCH</text>
      </g>

      <g transform="translate(578)">
        <rect width="552" height="192" rx="17" fill="url(#card)" stroke="#0c9ce8" stroke-width="2"/>
        <ellipse cx="66" cy="44" rx="34" ry="14" fill="none" stroke="#1bdfff" stroke-width="4"/>
        <path d="M32 44V101C32 119 100 119 100 101V44M32 72C32 90 100 90 100 72" fill="none" stroke="#1bdfff" stroke-width="4"/>
        <text x="139" y="55" fill="#f2f8ff" font-size="25" font-weight="900">SYSTEM SCHEMAS</text>
        <text x="139" y="86" fill="#37dcff" font-size="17" font-weight="800">VISIBLE WITHOUT THE CLUTTER</text>
        <text x="30" y="137" fill="#aebed2" font-size="17">Grouped at the bottom and collapsed by default.</text>
        <text x="30" y="166" fill="#f2f8ff" font-size="16" font-weight="800">INFORMATION_SCHEMA · MYSQL · SYS</text>
      </g>

      <g transform="translate(1156)">
        <rect width="552" height="192" rx="17" fill="url(#card)" stroke="#0c9ce8" stroke-width="2"/>
        <circle cx="58" cy="50" r="20" fill="none" stroke="#1bdfff" stroke-width="4"/>
        <path d="M26 109C26 81 40 72 58 72S90 81 90 109" fill="none" stroke="#1bdfff" stroke-width="4"/>
        <path d="M92 49L105 62L130 33" fill="none" stroke="#9b71ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="154" y="55" fill="#f2f8ff" font-size="25" font-weight="900">USERS + PRIVILEGES</text>
        <text x="154" y="86" fill="#37dcff" font-size="17" font-weight="800">CLEAR, REVIEWABLE ACCESS</text>
        <text x="30" y="137" fill="#aebed2" font-size="17">Inspect and manage who can do what.</text>
        <text x="30" y="166" fill="#f2f8ff" font-size="16" font-weight="800">MYSQL · MARIADB · REVIEW SQL FIRST</text>
      </g>
    </g>

    <text x="1840" y="1045" text-anchor="end" fill="#50f0c1" font-size="18" font-weight="900" letter-spacing="1">MYSQL · MARIADB · LOCAL-FIRST</text>
  </g>
</svg>
